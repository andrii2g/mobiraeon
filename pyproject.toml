[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[project]
name = "mobiraeon"
version = "0.1.0"
description = "Möbiræon application foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx2==2.16.0",
    "SQLAlchemy>=2.0.46,<2.1",
    "alembic>=1.18,<2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.scripts]
mobiraeon = "mobiraeon.cli:main"

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx2>=2.16.0",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "docs/**", "uv.lock", ".python-version", "bootstrap/**", "examples/**"]
source-exclude = ["/.tools", "/.venv", "/submissions", "/var", "/dist"]

[tool.ruff]
target-version = "py314"
line-length = 96
extend-exclude = ["submissions/increment-1/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
